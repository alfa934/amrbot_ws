# ============================================================
# AMCL
# ============================================================
amcl:
  ros__parameters:
    use_sim_time: false
    odom_model_type: diff
    min_particles: 100
    max_particles: 2000
    kld_err: 0.01
    kld_z: 0.99
    update_min_d: 0.2
    update_min_a: 0.2
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_max_beams: 60
    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map
    tf_broadcast: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    # Covariance for initial pose (large = don't trust initial guess)
    initial_cov_xx: 0.5
    initial_cov_yy: 0.5
    initial_cov_aa: 0.5
    # Odometry noise (adjust based on your robot)
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.2
    odom_alpha4: 0.2
    # Laser scan noise
    laser_z_hit: 0.95
    laser_z_short: 0.1
    laser_z_max: 0.05
    laser_z_rand: 0.05
    laser_sigma_hit: 0.2
    laser_lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    transform_tolerance: 0.1
    odom_topic: /odometry/filtered
    scan_topic: /scan


# ============================================================
# PLANNER SERVER
# ============================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins:
      - GridBased
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true
      tolerance: 0.5
      allow_unknown: true
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2


# ============================================================
# CONTROLLER SERVER
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    controller_plugins:
      - FollowPath
    goal_checker_plugins:
      - general_goal_checker
    progress_checker_plugins:
      - progress_checker
    current_goal_checker: general_goal_checker
    current_progress_checker: progress_checker

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # ===== SLIGHTLY FASTER (teeny bit) =====
      min_vel_x: -0.05
      max_vel_x: 0.07
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.07
      min_speed_theta: 0.0
      max_vel_theta: 0.2

      # ===== SLIGHTLY HIGHER ACCELERATION =====
      acc_lim_x: 0.08
      decel_lim_x: -0.08
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 0.2
      decel_lim_theta: -0.2

      # Sampling
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025

      # Tolerance & stopping
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      footprint: "[[-0.21, -0.255], [-0.21, 0.255], [0.21, 0.255], [0.21, -0.255]]"

      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PreferForward

      Oscillation.scale: 0.1
      Oscillation.oscillation_reset_dist: 0.05
      ObstacleFootprint.scale: 0.02
      GoalAlign.scale: 0.2
      GoalAlign.forward_point_distance: 0.2
      PathAlign.scale: 0.5
      PathAlign.forward_point_distance: 0.2
      PreferForward.scale: 0.0
      RotateToGoal.scale: 0.1
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

      path_distance_bias: 0.6
      goal_distance_bias: 0.8
      occdist_scale: 0.01
      twirling_scale: 0.0

    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2


# ============================================================
# BT NAVIGATOR
# ============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.2
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    navigators:
      - navigate_to_pose
      - navigate_through_poses
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"


# ============================================================
# BEHAVIOR SERVER
# ============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins:
      - spin
      - backup
      - wait
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2
    backup_speed: 0.1
    backup_duration: 2.0


# ============================================================
# COLLISION MONITOR
# ============================================================
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    transform_tolerance: 0.2
    source_timeout: 0.5
    stop_pub_timeout: 2.0
    observation_sources:
      - scan
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 0.5
      clearing: false
      marking: true
      obstacle_min_range: 0.1
      obstacle_max_range: 3.0
    polygons:
      - FootprintApproach
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: false
    collision_check_radius: 0.1
    stop_radius: 0.2


# ============================================================
# WAYPOINT FOLLOWER
# ============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false
      waypoint_pause_duration: 0


# ============================================================
# SMOOTHER SERVER
# ============================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
      - simple_smoother
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


# ============================================================
# VELOCITY SMOOTHER (slightly faster)
# ============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "CLOSED_LOOP"

    max_velocity:
      - 0.07
      - 0.0
      - 0.2

    min_velocity:
      - -0.05
      - 0.0
      - -0.2

    max_accel:
      - 0.08
      - 0.0
      - 0.2

    max_decel:
      - -0.08
      - 0.0
      - -0.2

    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity:
      - 0.0
      - 0.0
      - 0.0
    velocity_timeout: 1.0


# ============================================================
# LOCAL COSTMAP
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 5.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.2
      footprint: "[[-0.21, -0.255], [-0.21, 0.255], [0.21, 0.255], [0.21, -0.255]]"
      plugins:
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          observation_persistence: 0.0
          expected_update_rate: 0.0
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1
          raytrace_max_range: 3.5
          raytrace_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 3.0
      always_send_full_costmap: true


# ============================================================
# GLOBAL COSTMAP
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      transform_tolerance: 2.0
      footprint: "[[-0.21, -0.255], [-0.21, 0.255], [0.21, 0.255], [0.21, -0.255]]"
      track_unknown_space: true
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          observation_persistence: 0.0
          expected_update_rate: 0.0
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1
          raytrace_max_range: 3.5
          raytrace_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 3.0
      always_send_full_costmap: true