amcl:
  ros__parameters:
    use_sim_time: false
    odom_model_type: diff
    min_particles: 100
    max_particles: 2000
    kld_err: 0.01
    kld_z: 0.99
    update_min_d: 0.2
    update_min_a: 0.2
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_max_beams: 60
    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map
    tf_broadcast: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    # Covariance for initial pose (large = don't trust initial guess)
    initial_cov_xx: 0.5
    initial_cov_yy: 0.5
    initial_cov_aa: 0.5
    # Odometry noise (adjust based on your robot)
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.2
    odom_alpha4: 0.2
    # Laser scan noise
    laser_z_hit: 0.95
    laser_z_short: 0.1
    laser_z_max: 0.05
    laser_z_rand: 0.05
    laser_sigma_hit: 0.2
    laser_lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    transform_tolerance: 0.1